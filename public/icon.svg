<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Loom">
  <title>Loom</title>
  <desc>A fine champagne-gold hairline L with a single thin comet-cyan weft thread woven under its riser, on a cool-black tile lit by a faint top-left key light.</desc>
  <defs>
    <clipPath id="tile">
      <rect width="512" height="512" rx="114" ry="114" />
    </clipPath>
    <radialGradient id="keylight" cx="0.2" cy="0.1" r="0.95">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.065" />
      <stop offset="0.38" stop-color="#FFFFFF" stop-opacity="0.022" />
      <stop offset="0.72" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldstroke" x1="0" y1="128" x2="0" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E3C56A" />
      <stop offset="0.07" stop-color="#DDBC60" />
      <stop offset="0.26" stop-color="#C8A24A" />
      <stop offset="1" stop-color="#C8A24A" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" ry="114" fill="#07090C" />
  <rect width="512" height="512" rx="114" ry="114" fill="url(#keylight)" />
  <g clip-path="url(#tile)">
    <g stroke="#11151A" stroke-width="2">
      <line x1="180" y1="64" x2="180" y2="448" />
      <line x1="268" y1="64" x2="268" y2="448" />
      <line x1="356" y1="64" x2="356" y2="448" />
    </g>
    <line x1="146" y1="292" x2="340" y2="292" stroke="#4BC5DE" stroke-width="12" stroke-linecap="round" />
    <path d="M180 140 V372 H344" fill="none" stroke="url(#goldstroke)" stroke-width="24"
          stroke-linecap="round" stroke-linejoin="round" />
    <line x1="196" y1="292" x2="340" y2="292" stroke="#4BC5DE" stroke-width="12" stroke-linecap="round" />
  </g>
  <rect x="1" y="1" width="510" height="510" rx="113" ry="113" fill="none" stroke="#232A33" stroke-width="2" />
</svg>
