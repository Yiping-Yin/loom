<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">LOOM interlaced L mark</title>
  <desc id="desc">A reduced LOOM app icon where one woven thread interlaces with a clean L mark.</desc>
  <defs>
    <linearGradient id="tile" x1="14%" y1="7%" x2="88%" y2="96%">
      <stop offset="0%" stop-color="#2ac8dc" />
      <stop offset="48%" stop-color="#146d9c" />
      <stop offset="100%" stop-color="#082038" />
    </linearGradient>
    <radialGradient id="tileLight" cx="30%" cy="16%" r="78%">
      <stop offset="0%" stop-color="#bafcff" stop-opacity="0.58" />
      <stop offset="42%" stop-color="#3bc2e7" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#082038" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="silver" x1="20%" y1="8%" x2="86%" y2="96%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="62%" stop-color="#dcecf2" />
      <stop offset="100%" stop-color="#aec7d2" />
    </linearGradient>
    <linearGradient id="thread" x1="16%" y1="44%" x2="90%" y2="68%">
      <stop offset="0%" stop-color="#3ee1ff" />
      <stop offset="42%" stop-color="#f6fdff" />
      <stop offset="100%" stop-color="#58b9ff" />
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#00101f" flood-opacity="0.42" />
    </filter>
    <filter id="glow" x="-40%" y="-95%" width="180%" height="290%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>

  <rect x="96" y="96" width="832" height="832" rx="190" fill="url(#tile)" />
  <rect x="96" y="96" width="832" height="832" rx="190" fill="url(#tileLight)" />
  <rect x="97.5" y="97.5" width="829" height="829" rx="188.5" fill="none" stroke="#c1f6ff" stroke-width="3" opacity="0.32" />

  <g filter="url(#shadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 352 294 V 704 H 768" stroke="url(#silver)" stroke-width="76" />
    <path d="M 236 524 C 350 442, 486 456, 578 536 C 654 602, 720 638, 838 638" stroke="#087faa" stroke-width="92" opacity="0.22" filter="url(#glow)" />
    <path d="M 236 524 C 350 442, 486 456, 578 536 C 654 602, 720 638, 838 638" stroke="url(#thread)" stroke-width="64" />
    <path d="M 352 294 V 470" stroke="url(#silver)" stroke-width="76" />
    <path d="M 352 616 V 704 H 768" stroke="url(#silver)" stroke-width="76" />
  </g>
</svg>
