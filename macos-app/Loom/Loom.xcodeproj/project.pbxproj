			shellScript = "set -eu\nif [ \"${LOOM_SKIP_WEB_STAGE:-}\" = \"1\" ]; then\n  echo \"Loom: LOOM_SKIP_WEB_STAGE=1 — skipping web bundle stage.\"\n  exit 0\nfi\nREPO=\"${PROJECT_DIR}/../..\"\nEXPORT=\"${REPO}/.next-export\"\nDEST=\"${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/Contents/Resources/web\"\nif [ ! -d \"$EXPORT\" ]; then\n  echo \"Loom: .next-export/ not found — skipping web bundle stage.\"\n  echo \"       Run 'node scripts/build-static-export.mjs' from the repo root\"\n  echo \"       before a Release build to bundle the pre-rendered pages.\"\n  if [ \"${CONFIGURATION:-}\" = \"Release\" ]; then\n    exit 1\n  fi\n  exit 0\nfi\nmkdir -p \"$DEST\"\n# Slim CV/dossier staging (2026-07-08 web retirement 7/7): the bundle\n# exists to serve the owner dossier + its evidence, so only those\n# surfaces ship. Excluded:\n# - derived search/RAG indexes: the only native consumers were the\n#   born-broken loom:// URLSession loaders (URLSession cannot resolve\n#   a WKWebView custom scheme) — zero readers.\n#   (related/atlas now name the actual .json files; the bare names\n#   never matched anything.)\n# - (wiki/ was excluded 2026-07-08 pending migration; owner approved\n#   re-staging it 2026-07-09 — the wiki IS the book, served bundled.)\n# - design/, icon-apple-preview-8k.png, brand explorations/wordmark\n#   archive: zero references from any staged page — only the seven\n#   institution/brand images the dossier actually renders stay.\n# Kept deliberately: optibook/ (owner CV evidence artifact linked\n# from the dossier) and loom/history (product story behind the\n# dossier brand link).\nEXCLUDES=\"--exclude=rag-index.json --exclude=search-index.json --exclude=pagefind --exclude=related.json --exclude=atlas.json\"\nEXCLUDES=\"$EXCLUDES --exclude=design --exclude=icon-apple-preview-8k.png\"\nEXCLUDES=\"$EXCLUDES --exclude=brand/explorations --exclude=brand/loom_app_icon* --exclude=brand/loom_wordmark* --exclude=brand/loom_icon_var6.png --exclude=brand/loom_lunar_comet_icon.* --exclude=brand/lunar-comet-ledger-*\"\nif command -v rsync >/dev/null 2>&1; then\n  if ! rsync -a --delete $EXCLUDES \"$EXPORT/\" \"$DEST/\"; then\n    echo \"Loom: rsync failed — falling back to cp -R\"\n    rm -rf \"$DEST\"\n    mkdir -p \"$DEST\"\n    cp -R \"$EXPORT\"/. \"$DEST\"/\n  fi\nelse\n  rm -rf \"$DEST\"\n  mkdir -p \"$DEST\"\n  cp -R \"$EXPORT\"/. \"$DEST\"/\nfi\necho \"Loom: staged $(find \"$DEST\" -type f | wc -l | tr -d ' ') files to Resources/web\"\n";
		};
