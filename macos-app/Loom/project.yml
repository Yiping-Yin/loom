name: Loom
options:
  bundleIdPrefix: com.yinyiping
  deploymentTarget:
    # macOS 27.0 — local development and validation are now Xcode 27 only.
    # Keeping the project floor aligned with the installed SDK prevents
    # accidental pre-27 rebuilds and lets the native app use the
    # current macOS 27 system material / FoundationModels stack directly.
    macOS: "27.0"
  xcodeVersion: "27.0"
  minimumXcodeGenVersion: "2.30"

packages:
  # Phase 3 ingest-extractor-refactor dependencies (2026-04-24).
  # Both are pure-Swift SPM packages with no native / network / IPC
  # surface so the sandbox entitlements in this file cover them.
  # CoreXLSX — OOXML (.xlsx) parser for SpreadsheetExtractor.
  CoreXLSX:
    url: https://github.com/CoreOffice/CoreXLSX
    from: 0.14.0
  # ZipFoundation — zip archive reader used by SlideDeckExtractor to
  # pull text runs out of .pptx files. Unused for the PDF/text-dump
  # path; kept wired so Phase 4+ can opt in without a second rebuild.
  # Upstream exposes the library as `ZIPFoundation` (all-caps IP). We
  # name the package entry to match so the `dependencies:` entry below
  # resolves to the correct product identifier.
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.18

targets:
  Loom:
    type: application
    platform: macOS
    sources:
      - Sources
      - Assets.xcassets
      - Resources
      # Shared XPC contract with the non-sandboxed anchor helper — the one
      # file both processes compile (docs/projects/active/
      # 2026-06-30-loom-anchor-precision-handoff.md).
      - path: AnchorHelper/LoomAnchorHelperProtocol.swift
    dependencies:
      - package: CoreXLSX
      - package: ZIPFoundation
      # Anchor-precision helper: embedded XPC service, NOT sandboxed, so it
      # can read the source app's Accessibility tree (AXDocument + page)
      # while the main app keeps its sandbox. Direct-distribution only —
      # a Mac App Store build would need every component sandboxed.
      - target: LoomAnchorHelper
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: Loom
        # BUNDLE ID — personal reverse-DNS per 2026-04-21 trademark memo.
        # Multiple Looms coexist on the App Store; uniqueness comes from
        # this ID + the App Store subtitle.
        PRODUCT_BUNDLE_IDENTIFIER: com.yinyiping.loom
        # 1.2.0 = the macOS 27-only line: project floor 27.0, Xcode 27 toolchain,
        # runtime availability gates flattened. One version across app + helper.
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        DEVELOPMENT_TEAM: 8BW2794353
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Education/Reference per the trademark-check memo (2026-04-21) —
        # helps App Store disambiguation from other "Loom"-named apps in
        # video/productivity categories.
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.education"
        INFOPLIST_KEY_LSApplicationSecondaryCategoryType: "public.app-category.reference"
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026"
        # Short App Store blurb — max 30 chars; shown under app name in
        # search results. Education-category convention is a concise
        # statement of purpose ("A screen that replaces paper.")
        INFOPLIST_KEY_CFBundleGetInfoString: "Loom — a screen that replaces paper"
    info:
      path: Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleName: Loom
        CFBundleDisplayName: Loom
        CFBundleDocumentTypes:
          - CFBundleTypeName: Learning documents
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
              - public.text
              - public.plain-text
              - public.rtf
              - public.image
              - org.openxmlformats.wordprocessingml.document
              - com.microsoft.word.doc
              - org.openxmlformats.spreadsheetml.sheet
              - com.microsoft.excel.xls
              - org.openxmlformats.presentationml.presentation
              - com.microsoft.powerpoint.ppt
              # Charter §22: keep this list in lockstep with
              # nativeFileImporterContentTypes() (IngestionView.swift) —
              # tests/loom-doc-types.test.ts trips on drift.
              - net.daringfireball.markdown
              - com.apple.rtfd
              - public.comma-separated-values-text
              - public.tab-separated-values-text
              - com.apple.iwork.pages.pages
              - com.apple.iwork.keynote.key
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: com.yinyiping.loom
            CFBundleURLSchemes:
              - loom
        LSApplicationCategoryType: "public.app-category.education"
        NSServices:
          - NSMenuItem:
              default: Capture Selection in Loom
            NSMessage: captureSelectionInLoom
            NSPortName: Loom
            # One-keystroke capture: select text -> Cmd-Shift-U (U for
            # Understanding). Services key equivalents are always
            # Cmd-Shift-<LETTER>: digits never fire (Shift+1 emits "!", so
            # the equivalent can't match — verified live: pbs accepts "1"
            # but Preview's Services menu shows no key and the stroke is
            # dead). Letter collisions verified live too: L loses to the
            # system "Search with Google" service (opened Safari from
            # Preview), Y is Sticky Note, M is man-page, and Word/Excel/
            # old-LOOM menus own most other letters (app menus win over
            # Services). U is unbound in Preview, Word, and Excel. Users can
            # remap in System Settings > Keyboard > Keyboard Shortcuts >
            # Services. The capture route itself stays Services/pasteboard
            # per the layout contract.
            NSKeyEquivalent:
              default: U
            NSSendTypes:
              - NSStringPboardType
              - public.utf8-plain-text
              - public.file-url
    preBuildScripts:
      - name: Stage Next.js static export into bundle Resources
        # Stages `.next-export/` output into the .app bundle's Resources/web
        # so the loom:// URL scheme handler can serve pre-rendered pages
        # without a running Next.js server. Debug builds can still run in
        # localhost-dev mode without staged content, but Release/App Store
        # builds must fail if `.next-export/` is missing.
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          if [ "${LOOM_SKIP_WEB_STAGE:-}" = "1" ]; then
            echo "Loom: LOOM_SKIP_WEB_STAGE=1 — skipping web bundle stage."
            exit 0
          fi
          REPO="${PROJECT_DIR}/../.."
          EXPORT="${REPO}/.next-export"
          DEST="${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/Contents/Resources/web"
          if [ ! -d "$EXPORT" ]; then
            echo "Loom: .next-export/ not found — skipping web bundle stage."
            echo "       Run 'node scripts/build-static-export.mjs' from the repo root"
            echo "       before a Release build to bundle the pre-rendered pages."
            if [ "${CONFIGURATION:-}" = "Release" ]; then
              exit 1
            fi
            exit 0
          fi
          mkdir -p "$DEST"
          # Slim CV/dossier staging (2026-07-08 web retirement 7/7): the bundle
          # exists to serve the owner dossier + its evidence, so only those
          # surfaces ship. Excluded:
          # - derived search/RAG indexes: the only native consumers were the
          #   born-broken loom:// URLSession loaders (URLSession cannot resolve
          #   a WKWebView custom scheme) — zero readers.
          #   (related/atlas now name the actual .json files; the bare names
          #   never matched anything.)
          # - wiki/: study notes are a Workspace concern queued for native
          #   content-root migration; no dossier surface links there. ~18MB.
          # - design/, icon-apple-preview-8k.png, brand explorations/wordmark
          #   archive: zero references from any staged page — only the seven
          #   institution/brand images the dossier actually renders stay.
          # Kept deliberately: optibook/ (owner CV evidence artifact linked
          # from the dossier) and loom/history (product story behind the
          # dossier brand link).
          EXCLUDES="--exclude=rag-index.json --exclude=search-index.json --exclude=pagefind --exclude=related.json --exclude=atlas.json"
          EXCLUDES="$EXCLUDES --exclude=wiki --exclude=wiki.html --exclude=wiki.txt"
          EXCLUDES="$EXCLUDES --exclude=design --exclude=icon-apple-preview-8k.png"
          EXCLUDES="$EXCLUDES --exclude=brand/explorations --exclude=brand/loom_app_icon* --exclude=brand/loom_wordmark* --exclude=brand/loom_icon_var6.png --exclude=brand/loom_lunar_comet_icon.* --exclude=brand/lunar-comet-ledger-*"
          if command -v rsync >/dev/null 2>&1; then
            if ! rsync -a --delete $EXCLUDES "$EXPORT/" "$DEST/"; then
              echo "Loom: rsync failed — falling back to cp -R"
              rm -rf "$DEST"
              mkdir -p "$DEST"
              cp -R "$EXPORT"/. "$DEST"/
            fi
          else
            rm -rf "$DEST"
            mkdir -p "$DEST"
            cp -R "$EXPORT"/. "$DEST"/
          fi
          echo "Loom: staged $(find "$DEST" -type f | wc -l | tr -d ' ') files to Resources/web"
    postBuildScripts:
      - name: Rebuild high-resolution AppIcon.icns
        # Xcode's asset-catalog linker can emit an AppIcon.icns capped at
        # 256px even when the AppIcon.appiconset contains 512/1024 sources.
        # Rebuild the icon file from the full iconset before signing so the
        # installed app keeps crisp Dock/Launchpad imagery at large Retina
        # sizes.
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          APP="${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}"
          ASSET_DIR="${PROJECT_DIR}/Assets.xcassets/AppIcon.appiconset"
          ICONSET="${TARGET_TEMP_DIR}/LoomAppIcon.iconset"
          if [ ! -d "$APP" ]; then
            echo "Loom: app bundle not present yet; skipping AppIcon.icns rebuild."
            exit 0
          fi
          if ! command -v iconutil >/dev/null 2>&1; then
            echo "Loom: iconutil unavailable; cannot rebuild high-resolution AppIcon.icns."
            exit 1
          fi
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          cp "$ASSET_DIR/icon_16.png" "$ICONSET/icon_16x16.png"
          cp "$ASSET_DIR/icon_32.png" "$ICONSET/icon_16x16@2x.png"
          cp "$ASSET_DIR/icon_32.png" "$ICONSET/icon_32x32.png"
          cp "$ASSET_DIR/icon_64.png" "$ICONSET/icon_32x32@2x.png"
          cp "$ASSET_DIR/icon_128.png" "$ICONSET/icon_128x128.png"
          cp "$ASSET_DIR/icon_256.png" "$ICONSET/icon_128x128@2x.png"
          cp "$ASSET_DIR/icon_256.png" "$ICONSET/icon_256x256.png"
          cp "$ASSET_DIR/icon_512.png" "$ICONSET/icon_256x256@2x.png"
          cp "$ASSET_DIR/icon_512.png" "$ICONSET/icon_512x512.png"
          cp "$ASSET_DIR/icon_1024.png" "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"
          rm -rf "$ICONSET"
          echo "Loom: rebuilt high-resolution AppIcon.icns."
      - name: Strip signing-blocking xattrs from app bundle
        # Xcode signs the bundle after target build phases. The staged
        # static export can inherit macOS resource-fork/Finder metadata from
        # the repo, and codesign rejects bundles that still contain those
        # attributes. Strip them from the assembled app immediately before
        # signing, then fail with a concrete permission hint if TCC prevents
        # that cleanup from taking effect. com.apple.provenance can be
        # reattached by macOS/Xcode and may be undeletable even when xattr
        # exits successfully, so we report it without making this phase
        # stricter than codesign itself.
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          APP="${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}"
          if [ ! -d "$APP" ]; then
            echo "Loom: app bundle not present yet; skipping xattr cleanup."
            exit 0
          fi
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "NO" ]; then
            echo "Loom: CODE_SIGNING_ALLOWED=NO — skipping signing xattr preflight."
            exit 0
          fi
          if ! command -v xattr >/dev/null 2>&1; then
            echo "Loom: xattr unavailable; cannot strip signing detritus."
            exit 1
          fi
          xattr -cr "$APP"
          if xattr -lr "$APP" 2>/dev/null | grep -E 'com\.apple\.(ResourceFork|FinderInfo)' >/dev/null; then
            echo "Loom: signing-blocking xattrs remain after xattr -cr."
            echo "      Grant Full Disk Access to the build host (Terminal, Xcode, or Codex) and rebuild."
            xattr -lr "$APP" 2>/dev/null | grep -E 'com\.apple\.(ResourceFork|FinderInfo)' | head -40
            exit 1
          fi
          PROVENANCE_COUNT="$(xattr -lr "$APP" 2>/dev/null | grep -c 'com\.apple\.provenance' || true)"
          if [ "$PROVENANCE_COUNT" != "0" ]; then
            echo "Loom: com.apple.provenance remains on ${PROVENANCE_COUNT} bundle paths; leaving final judgment to codesign."
          fi
          echo "Loom: stripped signing-blocking extended attributes from app bundle."
    entitlements:
      path: Loom.entitlements
      properties:
        # Sandbox enabled 2026-04-24 for App Store submission (Phase 6).
        # Keychain + security-scoped bookmarks + network.client already
        # wired to operate under sandbox.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Needed for outbound HTTPS (Anthropic / OpenAI / custom endpoints
        # / localhost Ollama). network.server was retained for an earlier
        # architecture that bundled node; the current design doesn't bind
        # any server, but keeping it off-by-default is fine — no listener
        # is created at runtime.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true

  LoomAnchorHelper:
    # Non-sandboxed XPC service that resolves the source anchor (file URL +
    # page) via Accessibility for the sandboxed main app. Deliberately has
    # NO entitlements block: no app-sandbox — that is the entire point
    # (sandboxed processes cannot read another app's AX tree). It needs its
    # own Accessibility grant in System Settings > Privacy & Security.
    type: xpc-service
    platform: macOS
    sources:
      - AnchorHelper
    settings:
      base:
        PRODUCT_NAME: LoomAnchorHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.yinyiping.loom.AnchorHelper
        # Version comes from the same pair as the app target — one version.
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        DEVELOPMENT_TEAM: 8BW2794353
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: AnchorHelper/Info.plist
      properties:
        CFBundleName: LoomAnchorHelper
        # One version across app + helper (xcodegen regenerates this plist,
        # so the pair must live HERE, not as hand edits to the plist file).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        XPCService:
          ServiceType: Application

  LoomTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - fixtures/**/README.md
          # Gitignored local-only fixture (read via #filePath at runtime);
          # must not enter the pbxproj or CI builds fail on the missing file.
          - fixtures/real-workspace-snapshot.json
          - fixtures/**/generate_fixtures.py
    dependencies:
      - target: Loom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yinyiping.loomTests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 8BW2794353
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
